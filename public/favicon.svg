<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art mark: the three persona accents (builder / crafter / explorer)
       stepping down a dark character-select backdrop. -->
  <rect width="16" height="16" fill="#0a0f1f"/>
  <rect x="1" y="1" width="2" height="1" fill="#e8e5dc" opacity="0.35"/>
  <rect x="1" y="1" width="1" height="2" fill="#e8e5dc" opacity="0.35"/>
  <rect x="13" y="14" width="2" height="1" fill="#e8e5dc" opacity="0.35"/>
  <rect x="14" y="13" width="1" height="2" fill="#e8e5dc" opacity="0.35"/>
  <rect x="3" y="3" width="4" height="4" fill="#4FA3FF"/>
  <rect x="6" y="6" width="4" height="4" fill="#E8B547"/>
  <rect x="9" y="9" width="4" height="4" fill="#7DD181"/>
</svg>
