<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ching Yen — Portfolio</title>
    <meta name="description" content="Ching Yen — engineer, designer, photographer." />
    <meta name="theme-color" content="#0a0f1f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Social link previews (LinkedIn / Twitter / iMessage etc.). og:image
         must be an absolute URL for scrapers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ching Yen — Portfolio" />
    <meta property="og:title" content="Ching Yen — Portfolio" />
    <meta property="og:description" content="Ching Yen — engineer, designer, photographer." />
    <meta property="og:url" content="https://foochingyen.netlify.app/" />
    <meta property="og:image" content="https://foochingyen.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ching Yen — Portfolio" />
    <meta name="twitter:description" content="Ching Yen — engineer, designer, photographer." />
    <meta name="twitter:image" content="https://foochingyen.netlify.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static form for Netlify Forms detection. Netlify scans built HTML at deploy
      time and registers any form with `data-netlify`. The React modal POSTs to
      "/" with the same field names; this hidden copy is just the schema.
    -->
    <form name="explorer-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
